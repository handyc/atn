<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}atn · corpus atlas{% endblock %}</title>
<style>
  :root{
    --ink:#1a1c20; --muted:#6b7280; --line:#e5e7eb; --bg:#fafafa; --card:#fff;
    --accent:#3b5bdb; --accent-soft:#eef2ff; --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;
             display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header.top .brand{font-weight:700;letter-spacing:.3px}
  header.top .brand b{color:var(--accent)}
  header.top nav a{margin-right:16px;color:var(--muted);font-size:14px}
  header.top nav a:hover{color:var(--ink)}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  .sub{color:var(--muted);font-size:13.5px;margin:-6px 0 20px}
  .sub code{font-family:var(--mono)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
        transition:box-shadow .12s,border-color .12s}
  .card:hover{box-shadow:0 4px 18px rgba(20,30,60,.07);border-color:#c7d2fe}
  .chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;
        padding:2px 10px;font-size:12px;font-weight:600}
  .chip.muted{background:#f1f3f5;color:var(--muted)}
  .eid{font-family:var(--mono);color:var(--muted);font-size:12px}
  .terms{font-family:var(--mono);font-size:13px;color:#334;margin:8px 0;word-spacing:2px;line-height:1.7}
  .sample{color:var(--muted);font-size:13px;font-style:italic;margin-top:8px}
  .bpb{font-family:var(--mono);font-weight:700}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
  td.num{font-family:var(--mono)}
  .qbox{display:flex;gap:8px;margin:6px 0 20px}
  .qbox input[type=text]{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .qbox button{padding:11px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .note{background:var(--accent-soft);border:1px solid #dbe4ff;border-radius:8px;padding:12px 14px;
        color:#334;font-size:13.5px;margin:18px 0}
  .meta{color:var(--muted);font-size:13px;font-family:var(--mono);margin:4px 0 16px}
  .winner{border:2px solid var(--accent);background:#fff}
  h1{font-size:22px;margin:18px 0 4px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px}
  .back{font-size:13px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px}
</style>
</head>
<body>
<header class="top">
  <span class="brand"><b>atn</b> · corpus atlas</span>
  <nav>
    <a href="{% url 'atlas' %}">Atlas</a>
    <a href="{% url 'overview' %}">Overview</a>
    <a href="{% url 'heatmap' %}">Heatmap</a>
    <a href="{% url 'predict' %}">Predict</a>
    <a href="{% url 'query' %}">Live query</a>
    <a href="{% url 'graph' %}">Graph</a>
    <a href="/admin/">Admin</a>
  </nav>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<footer>a population of cheap n-gram experts tiling one corpus · scores are bits/byte of surprisal (lower = better fit)</footer>
</body>
</html>
